<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CPC FIR filter RTL resource optimization</title>
  <desc id="desc">The 2025 four-bank, four-MAC FIR architecture is reduced to two SRAM banks and two MAC units while staying within a twenty-clock sample period.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071110"/><stop offset="1" stop-color="#102522"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#75f8d2" stroke-opacity=".055"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#75f8d2"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <g font-family="Arial, sans-serif">
    <text x="82" y="94" fill="#75f8d2" font-size="24" font-weight="700" letter-spacing="4">2026 CLASS PROJECT CHALLENGE / SYSTEM SW</text>
    <text x="82" y="150" fill="#eef5f4" font-size="46" font-weight="700">Same throughput. Half the parallel MAC paths.</text>
    <text x="82" y="190" fill="#9fb4b1" font-size="20">2025 course report → 2nd presentation review → 3rd presentation review</text>

    <g transform="translate(82 260)">
      <rect width="390" height="330" rx="24" fill="#0c1d1b" stroke="#79908d" stroke-opacity=".45"/>
      <text x="28" y="45" fill="#79908d" font-size="17" font-weight="700" letter-spacing="3">2025 COURSE BASELINE</text>
      <text x="28" y="83" fill="#eef5f4" font-size="28" font-weight="700">4-bank / 4-MAC</text>
      <g transform="translate(28 114)" fill="#14332f" stroke="#79908d" stroke-opacity=".55">
        <rect width="142" height="52" rx="10"/><rect y="64" width="142" height="52" rx="10"/><rect y="128" width="142" height="52" rx="10"/><rect y="192" width="142" height="52" rx="10"/>
      </g>
      <g transform="translate(222 114)" fill="#213f3b" stroke="#79908d" stroke-opacity=".55">
        <rect width="116" height="52" rx="26"/><rect y="64" width="116" height="52" rx="26"/><rect y="128" width="116" height="52" rx="26"/><rect y="192" width="116" height="52" rx="26"/>
      </g>
      <g fill="#9fb4b1" font-size="16" font-weight="700" text-anchor="middle">
        <text x="99" y="147">SRAM 0</text><text x="99" y="211">SRAM 1</text><text x="99" y="275">SRAM 2</text><text x="99" y="339">SRAM 3</text>
        <text x="280" y="147">MAC 0</text><text x="280" y="211">MAC 1</text><text x="280" y="275">MAC 2</text><text x="280" y="339">MAC 3</text>
      </g>
      <g stroke="#79908d" stroke-width="2"><path d="M170 140h52"/><path d="M170 204h52"/><path d="M170 268h52"/><path d="M170 332h52"/></g>
    </g>

    <path d="M512 426H650" fill="none" stroke="#75f8d2" stroke-width="5" marker-end="url(#arrow)" filter="url(#glow)"/>
    <text x="580" y="396" text-anchor="middle" fill="#d5ff75" font-size="17" font-weight="700">REDESIGN</text>

    <g transform="translate(690 260)">
      <rect width="390" height="330" rx="24" fill="#0c1d1b" stroke="#75f8d2" stroke-opacity=".6"/>
      <text x="28" y="45" fill="#75f8d2" font-size="17" font-weight="700" letter-spacing="3">THIRD REVIEW DESIGN</text>
      <text x="28" y="83" fill="#eef5f4" font-size="28" font-weight="700">2-bank / 2-MAC</text>
      <g transform="translate(28 122)" fill="#14332f" stroke="#75f8d2" stroke-opacity=".55">
        <rect width="142" height="80" rx="14"/><rect y="104" width="142" height="80" rx="14"/>
      </g>
      <g transform="translate(222 122)" fill="#213f3b" stroke="#d5ff75" stroke-opacity=".62">
        <rect width="116" height="80" rx="40"/><rect y="104" width="116" height="80" rx="40"/>
      </g>
      <g fill="#eef5f4" font-size="18" font-weight="700" text-anchor="middle">
        <text x="99" y="158">SRAM 0</text><text x="99" y="181" fill="#75f8d2" font-size="14">Coeff 0–15</text>
        <text x="99" y="262">SRAM 1</text><text x="99" y="285" fill="#75f8d2" font-size="14">Coeff 16–31</text>
        <text x="280" y="171" fill="#d5ff75">MAC 0</text><text x="280" y="275" fill="#d5ff75">MAC 1</text>
      </g>
      <g stroke="#75f8d2" stroke-width="3"><path d="M170 162h52"/><path d="M170 266h52"/></g>
      <text x="28" y="321" fill="#9fb4b1" font-size="17">25-bit accumulate → final 16-bit saturation</text>
    </g>

    <g transform="translate(1140 260)">
      <rect width="378" height="330" rx="24" fill="#0c1d1b" stroke="#d5ff75" stroke-opacity=".5"/>
      <text x="28" y="45" fill="#d5ff75" font-size="17" font-weight="700" letter-spacing="3">CYCLE BUDGET</text>
      <text x="28" y="93" fill="#eef5f4" font-size="38" font-weight="700">20 clocks</text>
      <text x="28" y="124" fill="#9fb4b1" font-size="17">12 MHz ÷ 600 kHz per sample</text>
      <path d="M28 160H350" stroke="#294945" stroke-width="18" stroke-linecap="round"/>
      <path d="M28 160H286" stroke="#75f8d2" stroke-width="18" stroke-linecap="round"/>
      <text x="28" y="205" fill="#eef5f4" font-size="24" font-weight="700">16 MAC cycles</text>
      <text x="28" y="234" fill="#9fb4b1" font-size="17">32 folded coefficients ÷ 2 MAC</text>
      <text x="28" y="282" fill="#d5ff75" font-size="22" font-weight="700">+ clear / setup margin</text>
      <text x="28" y="314" fill="#9fb4b1" font-size="17">throughput preserved</text>
    </g>

    <g transform="translate(82 680)">
      <text fill="#79908d" font-size="17" font-weight="700" letter-spacing="3">SYNTHESIS RESULT / Firtop</text>
      <g transform="translate(0 38)">
        <rect width="690" height="102" rx="18" fill="#102522" stroke="#75f8d2" stroke-opacity=".4"/>
        <text x="28" y="37" fill="#9fb4b1" font-size="17">LUT</text><text x="94" y="40" fill="#eef5f4" font-size="30" font-weight="700">815 → 500</text><text x="310" y="40" fill="#d5ff75" font-size="25" font-weight="700">−38.7%</text>
        <text x="28" y="80" fill="#9fb4b1" font-size="17">FF</text><text x="94" y="83" fill="#eef5f4" font-size="30" font-weight="700">897 → 818</text><text x="310" y="83" fill="#d5ff75" font-size="25" font-weight="700">−8.8%</text>
      </g>
      <g transform="translate(744 38)">
        <rect width="692" height="102" rx="18" fill="#102522" stroke="#75f8d2" stroke-opacity=".4"/>
        <text x="28" y="39" fill="#75f8d2" font-size="18" font-weight="700">RTL OWNERSHIP</text>
        <text x="28" y="76" fill="#eef5f4" font-size="23" font-weight="700">parallelism · controller timing · datapath width</text>
      </g>
    </g>
  </g>
</svg>
