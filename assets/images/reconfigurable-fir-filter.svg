<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Four-parallel reconfigurable FIR filter architecture</title>
  <desc id="desc">A four-state controller with IDLE, WRITE, MAC, and SUM routes coefficients across four SRAM banks and four MAC units into a saturation adder tree.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071110"/><stop offset="1" stop-color="#102522"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#75f8d2" stroke-opacity=".055"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="state-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#75f8d2"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <g font-family="Arial, sans-serif">
    <text x="82" y="94" fill="#75f8d2" font-size="24" font-weight="700" letter-spacing="5">RECONFIGURABLE FIR / RTL DATA PATH</text>
    <text x="82" y="150" fill="#eef5f4" font-size="46" font-weight="700">Four banks. Four MACs. One bounded output.</text>

    <g transform="translate(84 242)">
      <rect width="286" height="348" rx="24" fill="#0c1d1b" stroke="#75f8d2" stroke-opacity=".5"/>
      <text x="28" y="42" fill="#75f8d2" font-size="18" font-weight="700" letter-spacing="3">CONTROL PLANE</text>
      <text x="28" y="68" fill="#79908d" font-size="13" font-weight="700" letter-spacing="2">4-STATE FSM</text>

      <g fill="#173a35" stroke="#75f8d2" stroke-opacity=".42">
        <rect x="28" y="88" width="92" height="52" rx="12" stroke="#d5ff75" stroke-opacity=".7"/>
        <rect x="166" y="88" width="92" height="52" rx="12"/>
        <rect x="166" y="166" width="92" height="52" rx="12"/>
        <rect x="28" y="166" width="92" height="52" rx="12"/>
      </g>
      <g fill="#eef5f4" font-size="18" font-weight="700" text-anchor="middle">
        <text x="74" y="121">IDLE</text>
        <text x="212" y="121">WRITE</text>
        <text x="212" y="199">MAC</text>
        <text x="74" y="199">SUM</text>
      </g>
      <g fill="none" stroke="#75f8d2" stroke-width="2.5" marker-end="url(#state-arrow)">
        <path d="M126 108H160" marker-start="url(#state-arrow)"/>
        <path d="M112 139C143 145 150 159 168 173"/>
        <path d="M160 192H126"/>
        <path d="M74 160V146"/>
      </g>

      <path d="M28 240H258" stroke="#2b4642"/>
      <text x="28" y="269" fill="#9fb4b1" font-size="17">12 MHz system clock</text>
      <text x="28" y="298" fill="#9fb4b1" font-size="17">600 kHz sampling</text>
      <text x="28" y="327" fill="#d5ff75" font-size="17">1–63 variable taps</text>
    </g>

    <g transform="translate(460 222)">
      <text fill="#79908d" font-size="18" font-weight="700" letter-spacing="3">4-PARALLEL MEMORY + MAC</text>
      <g transform="translate(0 42)">
        <g><rect width="184" height="86" rx="14" fill="#14332f" stroke="#75f8d2" stroke-opacity=".45"/><text x="26" y="34" fill="#75f8d2" font-size="17">SRAM BANK 0</text><text x="26" y="62" fill="#eef5f4" font-size="21" font-weight="700">Coeff 0–9</text></g>
        <g transform="translate(0 106)"><rect width="184" height="86" rx="14" fill="#14332f" stroke="#75f8d2" stroke-opacity=".45"/><text x="26" y="34" fill="#75f8d2" font-size="17">SRAM BANK 1</text><text x="26" y="62" fill="#eef5f4" font-size="21" font-weight="700">Coeff 10–19</text></g>
        <g transform="translate(0 212)"><rect width="184" height="86" rx="14" fill="#14332f" stroke="#75f8d2" stroke-opacity=".45"/><text x="26" y="34" fill="#75f8d2" font-size="17">SRAM BANK 2</text><text x="26" y="62" fill="#eef5f4" font-size="21" font-weight="700">Coeff 20–29</text></g>
        <g transform="translate(0 318)"><rect width="184" height="86" rx="14" fill="#14332f" stroke="#75f8d2" stroke-opacity=".45"/><text x="26" y="34" fill="#75f8d2" font-size="17">SRAM BANK 3</text><text x="26" y="62" fill="#eef5f4" font-size="21" font-weight="700">Coeff 30–31</text></g>
      </g>
      <g transform="translate(300 42)">
        <g><rect width="154" height="86" rx="43" fill="#213f3b" stroke="#d5ff75" stroke-opacity=".55"/><text x="47" y="54" fill="#d5ff75" font-size="23" font-weight="700">MAC 0</text></g>
        <g transform="translate(0 106)"><rect width="154" height="86" rx="43" fill="#213f3b" stroke="#d5ff75" stroke-opacity=".55"/><text x="47" y="54" fill="#d5ff75" font-size="23" font-weight="700">MAC 1</text></g>
        <g transform="translate(0 212)"><rect width="154" height="86" rx="43" fill="#213f3b" stroke="#d5ff75" stroke-opacity=".55"/><text x="47" y="54" fill="#d5ff75" font-size="23" font-weight="700">MAC 2</text></g>
        <g transform="translate(0 318)"><rect width="154" height="86" rx="43" fill="#213f3b" stroke="#d5ff75" stroke-opacity=".55"/><text x="47" y="54" fill="#d5ff75" font-size="23" font-weight="700">MAC 3</text></g>
      </g>
      <g stroke="#75f8d2" stroke-width="3" fill="none"><path d="M184 85h116"/><path d="M184 191h116"/><path d="M184 297h116"/><path d="M184 403h116"/></g>
    </g>

    <g transform="translate(1044 280)">
      <text fill="#79908d" font-size="18" font-weight="700" letter-spacing="3">SATURATION TREE</text>
      <g transform="translate(0 68)" fill="#102d29" stroke="#75f8d2" stroke-opacity=".55"><rect width="140" height="76" rx="16"/><rect y="164" width="140" height="76" rx="16"/></g>
      <text x="36" y="116" fill="#eef5f4" font-size="24" font-weight="700">ADD 0/1</text><text x="36" y="280" fill="#eef5f4" font-size="24" font-weight="700">ADD 2/3</text>
      <path d="M140 106h98m-98 164h98m0-164v164" fill="none" stroke="#75f8d2" stroke-width="4"/>
      <rect x="238" y="147" width="190" height="82" rx="18" fill="#1b3531" stroke="#d5ff75" stroke-opacity=".7"/>
      <text x="272" y="181" fill="#d5ff75" font-size="17" font-weight="700">CLIP TO SIGNED</text><text x="287" y="210" fill="#eef5f4" font-size="24" font-weight="700">16-BIT</text>
      <path d="M428 188h98" stroke="#d5ff75" stroke-width="5" filter="url(#glow)"/>
      <text x="454" y="170" fill="#d5ff75" font-size="18" font-weight="700">OUT</text>
    </g>

    <g transform="translate(82 742)">
      <path d="M0 62h100l26-52 38 104 48-104 40 52h86l30-35 34 70 42-70 34 35h92l28-43 38 86 46-86 34 43h520" fill="none" stroke="#75f8d2" stroke-width="5" filter="url(#glow)"/>
      <text y="132" fill="#79908d" font-size="18" letter-spacing="2">IMPULSE RESPONSE VERIFIED · VARIABLE LENGTH VERIFIED · OVERFLOW CLAMPED</text>
    </g>
  </g>
</svg>
