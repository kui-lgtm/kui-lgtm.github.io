<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">동기화 적용 여부에 따른 처리 개수</title><desc id="desc">limit 200에서 동기화 적용 시 정확히 200개, 미적용 시 239개가 처리된 비교</desc>
  <rect width="760" height="420" rx="18" fill="#f6faf8"/>
  <g font-family="Arial,sans-serif">
    <text x="54" y="56" fill="#233a34" font-size="18" font-weight="700">Synchronization protects correctness, not just speed.</text>
    <line x1="78" y1="336" x2="694" y2="336" stroke="#a8bbb5" stroke-width="2"/>
    <g transform="translate(148 0)"><rect x="0" y="136" width="150" height="200" rx="12" fill="#24a886"/><text x="75" y="126" text-anchor="middle" fill="#1b332d" font-size="28" font-weight="700">200</text><text x="75" y="366" text-anchor="middle" fill="#49615a" font-size="15" font-weight="700">SYNC ON</text><text x="75" y="389" text-anchor="middle" fill="#788c86" font-size="12">limit preserved</text></g>
    <g transform="translate(462 0)"><rect x="0" y="97" width="150" height="239" rx="12" fill="#ff9d70"/><line x1="-30" y1="136" x2="180" y2="136" stroke="#d45f33" stroke-dasharray="7 6" stroke-width="2"/><text x="75" y="87" text-anchor="middle" fill="#b34420" font-size="28" font-weight="700">239</text><text x="75" y="366" text-anchor="middle" fill="#49615a" font-size="15" font-weight="700">SYNC OFF</text><text x="75" y="389" text-anchor="middle" fill="#b34420" font-size="12">39 extra items</text></g>
    <text x="380" y="119" text-anchor="middle" fill="#b34420" font-size="12" font-weight="700">LIMIT 200</text>
  </g>
</svg>
